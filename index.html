<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2e"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ars Golf Analytics</title>
  <link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar"><div><span class="eyebrow">ARS GOLF</span><h1>Analytics</h1></div><div class="header-actions"><button id="ideaBtn" class="ghost">＋ Idea</button><button id="installBtn" class="ghost hidden">Install</button></div></header>
  <main>
    <section id="dashboard" class="view active"></section>
    <section id="play" class="view"></section>
    <section id="rounds" class="view"></section>
    <section id="practice" class="view"></section>
    <section id="analytics" class="view"></section>
    <section id="settings" class="view"></section>
  </main>
  <nav aria-label="Primary"><button data-view="dashboard" class="active"><span>⌂</span>Home</button><button data-view="play"><span>＋</span>Play</button><button data-view="rounds"><span>▤</span>Rounds</button><button data-view="practice"><span>◎</span>Range</button><button data-view="analytics"><span>↗</span>Stats</button><button data-view="settings"><span>⚙</span>More</button></nav>
  <dialog id="modal"><form method="dialog"><button class="close" aria-label="Close">×</button><div id="modalBody"></div></form></dialog>
  <input id="importFile" type="file" accept="application/json" hidden>
  <input id="practiceFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple hidden>
  <div id="toast" role="status"></div>
  <script src="./app.js"></script>
</body></html>
